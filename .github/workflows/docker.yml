# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Build and test (publishing disabled)

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".env.example"
  pull_request:
    branches:
      - "main"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.x'

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev

      - name: Verify libvips install
        run: vips --version

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test ./...

# Image publishing is intentionally disabled: no registry login or push jobs.
# Future destination: ghcr.io/jason-roesgen/koito. Enable only in a separate review.
