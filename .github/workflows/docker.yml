# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Build and test (publishing disabled)

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".env.example"
  pull_request:
    branches:
      - "main"

  workflow_dispatch:

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev

      - name: Verify libvips install
        run: vips --version

      - name: Build
        run: go build -v ./...

      - name: Test
        uses: robherley/go-test-action@v0

# Image publishing is intentionally disabled: no registry login or push jobs.
# Future destination: ghcr.io/jason-roesgen/koito. Enable only in a separate review.
