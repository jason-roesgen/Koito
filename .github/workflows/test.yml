name: Test

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Install libvips
      run: |
        sudo apt-get update
        sudo apt-get install -y libvips-dev

    - name: Verify libvips install
      run: vips --version

    - name: Build
      run: go build -v ./...

    - name: Test
      uses: robherley/go-test-action@v0

  calendar:
    name: Calendar regression tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
    - name: Verify calendar and dashboard drilldown boundaries
      run: |
        set -euo pipefail
        for timezone in Europe/Berlin America/New_York UTC America/Santiago; do
          echo "Testing timezone: $timezone"
          TZ="$timezone" node --experimental-strip-types --test client/app/utils/chartCalendar.test.mjs
        done
