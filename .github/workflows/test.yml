name: Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.27.x'

    - name: Install libvips
      run: |
        sudo apt-get update
        sudo apt-get install -y libvips-dev

    - name: Verify libvips install
      run: vips --version

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test ./...

    - name: Check Go vulnerabilities
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
        "$(go env GOPATH)/bin/govulncheck" ./...

  calendar:
    name: Calendar regression tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
    - name: Verify calendar and dashboard drilldown boundaries
      run: |
        set -euo pipefail
        for timezone in Europe/Berlin America/New_York UTC America/Santiago; do
          echo "Testing timezone: $timezone"
          TZ="$timezone" node --experimental-strip-types --test client/app/utils/chartCalendar.test.mjs client/app/utils/repeatSessionDates.test.mjs
        done
    - name: Verify Hall of Fame demo projections
      run: node --experimental-strip-types client/app/utils/hallOfFame.test.mjs
